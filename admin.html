<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PCH – Admin Portal</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ===== PREMIUM 3D DESIGN – ADMIN ===== */

        /* ---- Reset & Base ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #e4e4f0;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ---- 3D Background Orbs ---- */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .bg-orbs .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #ffd700;
            top: -200px;
            right: -200px;
            animation-duration: 25s;
        }
        .bg-orbs .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #8e44ad;
            bottom: -100px;
            left: -100px;
            animation-duration: 30s;
        }
        .bg-orbs .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #3498db;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
        }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.2); }
        }

        /* ---- Sidebar (3D Glass) ---- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: rgba(20, 20, 46, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 215, 0, 0.08);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 4px 0 40px rgba(0,0,0,0.6);
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .sidebar.hidden {
            transform: translateX(-100%);
        }
        .sidebar .logo {
            padding: 0 24px 24px;
            font-size: 22px;
            font-weight: 800;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,215,0,0.08);
        }
        .sidebar .logo span {
            color: #fff;
            font-weight: 400;
            font-size: 14px;
            opacity: 0.6;
        }
        .sidebar .nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar .nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            color: #a7a9be;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
        }
        .sidebar .nav .nav-item:hover {
            background: rgba(255, 215, 0, 0.06);
            color: #fff;
        }
        .sidebar .nav .nav-item.active {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            box-shadow: inset 3px 0 0 #ffd700;
        }
        .sidebar .nav .nav-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .sidebar .nav .nav-item .badge {
            margin-left: auto;
            background: #e6192b;
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 700;
        }
        .sidebar .user-profile {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .user-profile .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,215,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .sidebar .user-profile .info {
            flex: 1;
        }
        .sidebar .user-profile .info .name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .sidebar .user-profile .info .role {
            font-size: 11px;
            color: #8888aa;
        }

        /* ---- Toggle Sidebar Button (mobile) ---- */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 101;
            background: rgba(20,20,46,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .sidebar-toggle:hover {
            background: rgba(255,215,0,0.1);
        }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            margin-left: 260px;
            padding: 24px 32px;
            position: relative;
            z-index: 1;
            overflow-y: auto;
            height: 100vh;
        }
        .main .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-wrap: wrap;
            gap: 12px;
        }
        .main .topbar .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        .main .topbar .page-title small {
            font-size: 14px;
            font-weight: 400;
            color: #8888aa;
            margin-left: 8px;
        }
        .main .topbar .actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .main .topbar .actions .search-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a7a9be;
            transition: 0.3s;
        }
        .main .topbar .actions .search-box:focus-within {
            border-color: rgba(255,215,0,0.3);
            background: rgba(255,255,255,0.06);
        }
        .main .topbar .actions .search-box input {
            background: none;
            border: none;
            color: #fff;
            font-size: 13px;
            outline: none;
            width: 160px;
        }
        .main .topbar .actions .search-box input::placeholder {
            color: #555;
        }
        .main .topbar .actions .notif-icon {
            position: relative;
            font-size: 22px;
            cursor: pointer;
            color: #a7a9be;
            transition: 0.3s;
        }
        .main .topbar .actions .notif-icon:hover {
            color: #ffd700;
        }
        .main .topbar .actions .notif-icon .dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            background: #e6192b;
            border-radius: 50%;
            border: 2px solid #0a0a1a;
        }

        /* ---- Content Area ---- */
        #main-content {
            padding-top: 16px;
        }

        /* ---- Responsive ---- */
        @media (max-width: 992px) {
            .sidebar {
                width: 220px;
            }
            .main {
                margin-left: 220px;
                padding: 20px 24px;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-toggle {
                display: block;
            }
            .main {
                margin-left: 0;
                padding: 16px 18px;
                padding-top: 72px;
            }
            .main .topbar .page-title {
                font-size: 20px;
            }
            .main .topbar .actions .search-box input {
                width: 100px;
            }
        }
        @media (max-width: 480px) {
            .main .topbar {
                flex-direction: column;
                align-items: stretch;
            }
            .main .topbar .actions {
                justify-content: space-between;
            }
            .main .topbar .actions .search-box {
                flex: 1;
            }
            .main .topbar .actions .search-box input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Sidebar Toggle (mobile) -->
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">🏆 PCH <span>Admin</span></div>
        <nav class="nav" id="adminNav">
            <!-- Links will be injected by JS -->
        </nav>
        <div class="user-profile">
            <div class="avatar">👤</div>
            <div class="info">
                <div class="name" id="adminName">Admin</div>
                <div class="role" id="adminRole">Super Admin</div>
            </div>
            <span style="color:#888;font-size:18px;cursor:pointer;" id="logoutSidebar">🚪</span>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <div class="topbar">
            <div class="page-title" id="pageTitle">Dashboard <small>Overview</small></div>
            <div class="actions">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search..." id="globalSearch" />
                </div>
                <div class="notif-icon" id="notifIcon">
                    🔔
                    <span class="dot" id="notifDot" style="display:none;"></span>
                </div>
            </div>
        </div>
        <div id="main-content"></div>
    </main>

    <script>
        // ---- Load sidebar navigation dynamically ----
        (function() {
            const nav = document.getElementById('adminNav');
            const links = [
                { label: 'Dashboard', icon: '📊', hash: '' },
                { label: 'Winners', icon: '👤', hash: 'winners' },
                { label: 'Schedules', icon: '📅', hash: 'schedules' },
                { label: 'Add Funds', icon: '💰', hash: 'add-funds' },
                { label: 'KYC Review', icon: '🪪', hash: 'kyc-review' },
                { label: 'Withdrawals Review', icon: '💳', hash: 'withdrawals-review' },
                { label: 'Announcements', icon: '📢', hash: 'announcements' },
                { label: 'Import', icon: '📂', hash: 'import' },
                { label: 'Audit', icon: '📋', hash: 'audit' },
                { label: 'Support', icon: '📞', hash: 'support' },
                { label: 'Settings', icon: '⚙️', hash: 'settings' }
            ];
            nav.innerHTML = links.map(l =>
                `<a class="nav-item" data-hash="${l.hash}" href="#${l.hash}">
                    <span class="icon">${l.icon}</span>
                    ${l.label}
                </a>`
            ).join('');

            // Highlight active link based on hash
            const currentHash = window.location.hash.replace('#', '');
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.dataset.hash === currentHash || (currentHash === '' && el.dataset.hash === '')) {
                    el.classList.add('active');
                }
                el.addEventListener('click', function(e) {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    this.classList.add('active');
                    // Update page title
                    const label = this.textContent.trim();
                    document.getElementById('pageTitle').innerHTML = label + ' <small>Management</small>';
                });
            });

            // Logout
            document.getElementById('logoutSidebar').addEventListener('click', function() {
                if (typeof window.logout === 'function') window.logout();
                else { localStorage.removeItem('pch_user'); window.location.href = 'index.html'; }
            });
        })();

        // ---- Sidebar toggle (mobile) ----
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // ---- Load header/footer (if needed) but we already have sidebar ----
        // We'll just load admin.js and app.js
    </script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin.js"></script>
    <script>
        // --- Admin.js will render content based on hash ---
        // Also update page title on hash change
        window.addEventListener('hashchange', function() {
            const hash = window.location.hash.replace('#', '');
            const activeLink = document.querySelector(`.nav-item[data-hash="${hash}"]`);
            if (activeLink) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                activeLink.classList.add('active');
                const label = activeLink.textContent.trim();
                document.getElementById('pageTitle').innerHTML = label + ' <small>Management</small>';
            }
        });

        // ---- Fix logout reference in header ----
        // The admin.js already has logout logic.
    </script>
</body>
</html>
