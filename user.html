<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PCH – User Portal</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ===== PREMIUM 3D DESIGN – USER ===== */

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #e4e4f0;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ---- Background Orbs (softer) ---- */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.10;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }
        .bg-orbs .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #ffd700;
            top: -100px;
            right: -100px;
            animation-duration: 28s;
        }
        .bg-orbs .orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: #8e44ad;
            bottom: -80px;
            left: -80px;
            animation-duration: 32s;
        }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.15); }
        }

        /* ---- Sidebar (User) ---- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100vh;
            background: rgba(20, 20, 46, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,215,0,0.06);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 4px 0 30px rgba(0,0,0,0.5);
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .sidebar.hidden {
            transform: translateX(-100%);
        }
        .sidebar .logo {
            padding: 0 20px 20px;
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,215,0,0.06);
        }
        .sidebar .logo span {
            color: #fff;
            font-weight: 400;
            font-size: 13px;
            opacity: 0.5;
        }
        .sidebar .nav {
            flex: 1;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar .nav .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            color: #a7a9be;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .sidebar .nav .nav-item:hover {
            background: rgba(255,215,0,0.06);
            color: #fff;
        }
        .sidebar .nav .nav-item.active {
            background: rgba(255,215,0,0.08);
            color: #ffd700;
            box-shadow: inset 3px 0 0 #ffd700;
        }
        .sidebar .nav .nav-item .icon {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }
        .sidebar .user-profile {
            padding: 14px 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .user-profile .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,215,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.15);
        }
        .sidebar .user-profile .info {
            flex: 1;
        }
        .sidebar .user-profile .info .name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .sidebar .user-profile .info .role {
            font-size: 10px;
            color: #8888aa;
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 101;
            background: rgba(20,20,46,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,0,0.12);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ffd700;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .sidebar-toggle:hover {
            background: rgba(255,215,0,0.08);
        }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            margin-left: 240px;
            padding: 24px 32px;
            position: relative;
            z-index: 1;
            overflow-y: auto;
            height: 100vh;
        }
        .main .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            flex-wrap: wrap;
            gap: 12px;
        }
        .main .topbar .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        .main .topbar .page-title small {
            font-size: 13px;
            font-weight: 400;
            color: #8888aa;
            margin-left: 8px;
        }
        .main .topbar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .main .topbar .actions .notif-icon {
            position: relative;
            font-size: 20px;
            cursor: pointer;
            color: #a7a9be;
            transition: 0.3s;
        }
        .main .topbar .actions .notif-icon:hover {
            color: #ffd700;
        }
        .main .topbar .actions .notif-icon .dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 8px;
            height: 8px;
            background: #e6192b;
            border-radius: 50%;
            border: 2px solid #0a0a1a;
        }

        #main-content {
            padding-top: 16px;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-toggle {
                display: block;
            }
            .main {
                margin-left: 0;
                padding: 16px 18px;
                padding-top: 72px;
            }
            .main .topbar .page-title {
                font-size: 18px;
            }
        }
        @media (max-width: 480px) {
            .main .topbar {
                flex-direction: column;
                align-items: stretch;
            }
            .main .topbar .actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">🏆 PCH <span>Winner</span></div>
        <nav class="nav" id="userNav">
            <!-- Injected by JS -->
        </nav>
        <div class="user-profile">
            <div class="avatar">👤</div>
            <div class="info">
                <div class="name" id="userName">Winner</div>
                <div class="role" id="userRole">VIP</div>
            </div>
            <span style="color:#888;font-size:18px;cursor:pointer;" id="logoutSidebar">🚪</span>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <div class="page-title" id="pageTitle">Dashboard <small>Overview</small></div>
            <div class="actions">
                <div class="notif-icon" id="notifIcon">
                    🔔
                    <span class="dot" id="notifDot" style="display:none;"></span>
                </div>
            </div>
        </div>
        <div id="main-content"></div>
    </main>

    <script>
        // ---- Sidebar nav ----
        (function() {
            const nav = document.getElementById('userNav');
            const links = [
                { label: 'Dashboard', icon: '📊', hash: '' },
                { label: 'Funding', icon: '💰', hash: 'funding' },
                { label: 'Cards', icon: '💳', hash: 'cards' },
                { label: 'Rewards', icon: '🎁', hash: 'rewards' },
                { label: 'Support', icon: '📞', hash: 'support' },
                { label: 'KYC', icon: '🪪', hash: 'kyc' },
                { label: 'Withdrawals', icon: '💸', hash: 'withdrawals' },
                { label: 'Transfers', icon: '↗️', hash: 'transfers' },
                { label: 'Activity', icon: '📋', hash: 'activity' },
                { label: 'Security', icon: '🔒', hash: 'security' },
                { label: 'Profile', icon: '👤', hash: 'profile' },
                { label: 'Settings', icon: '⚙️', hash: 'settings' }
            ];
            nav.innerHTML = links.map(l =>
                `<a class="nav-item" data-hash="${l.hash}" href="#${l.hash}">
                    <span class="icon">${l.icon}</span>
                    ${l.label}
                </a>`
            ).join('');

            const currentHash = window.location.hash.replace('#', '');
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.dataset.hash === currentHash || (currentHash === '' && el.dataset.hash === '')) {
                    el.classList.add('active');
                }
                el.addEventListener('click', function(e) {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    this.classList.add('active');
                    const label = this.textContent.trim();
                    document.getElementById('pageTitle').innerHTML = label + ' <small>Section</small>';
                });
            });

            document.getElementById('logoutSidebar').addEventListener('click', function() {
                if (typeof window.logout === 'function') window.logout();
                else { localStorage.removeItem('pch_user'); window.location.href = 'index.html'; }
            });
        })();

        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        window.addEventListener('hashchange', function() {
            const hash = window.location.hash.replace('#', '');
            const activeLink = document.querySelector(`.nav-item[data-hash="${hash}"]`);
            if (activeLink) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                activeLink.classList.add('active');
                const label = activeLink.textContent.trim();
                document.getElementById('pageTitle').innerHTML = label + ' <small>Section</small>';
            }
        });
    </script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/user.js"></script>
    <script>
        // User.js will handle content rendering.
    </script>
</body>
</html>
