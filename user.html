<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCH – User Portal</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Chart.js for charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf for PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="pch-container">
        <div id="header-placeholder"></div>
        <div id="main-content" class="mt-16"></div>
        <div id="footer-placeholder"></div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('assets/js/service-worker.js')
                .then(() => console.log('SW registered'))
                .catch(err => console.error('SW registration failed', err));
        }
    </script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/user.js"></script>
    <script>
        fetch('includes/header.html').then(r=>r.text()).then(h=>document.getElementById('header-placeholder').innerHTML=h);
        fetch('includes/footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-placeholder').innerHTML=h);
    </script>
</body>
</html>
